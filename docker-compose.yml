version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    restart: always

  api-gateway:
    build:
      context: ../api-gateway   
      dockerfile: Dockerfile
      secrets:
        - GITHUB_TOKEN
    ports:
      - "${PORT_API}:${PORT_API}"
    environment:
      - APP_PORT=${PORT_API}
      - AUTH_SERV_ADDR=auth-service
      - AUTH_SERV_PORT=${PORT_AUTH}
      - COURSE_SERV_ADDR=course-service
      - COURSE_SERV_PORT=${PORT_COURSE}
      - INVENTORY_SERV_ADDR=inventory-service
      - INVENTORY_SERV_PORT=${PORT_INVENTORY}
      - PARTICIPANT_SERV_ADDR=participant-service
      - PARTICIPANT_SERV_PORT=${PORT_PARTICIPANT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - STORAGE_REGION=${S3_STORAGE_REGION}
      - STORAGE_BUCKET=${S3_STORAGE_BUCKET}
    depends_on:
      - auth-service
      - course-service
      - inventory-service
      - participant-service

  migrate:
    image: migrate/migrate
    profiles: ["manual"]

  auth-db:
    image: postgres:15-alpine
    container_name: loanem-auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
      secrets:
        - GITHUB_TOKEN
    environment:
      - APP_PORT=${PORT_AUTH}
      - DB_HOST=${AUTH_DB_HOST}
      - DB_PORT=${AUTH_DB_PORT}
      - DB_USER=${AUTH_DB_USER}
      - DB_PASS=${AUTH_DB_PASS}
      - DB_NAME=${AUTH_DB_NAME}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_ACCESS_EXPIRE=${JWT_ACCESS_EXPIRE}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASS=${REDIS_PASS}
      - REDIS_DB=${REDIS_DB}
      - BASE_URL=${BASE_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
    volumes:
      - ./secrets/auth:/run/secrets/auth:ro
    depends_on:
      - auth-db
      - redis

  course-db:
    image: postgres:15-alpine
    container_name: loanem-course-db
    environment:
      POSTGRES_USER: ${COURSE_DB_USER}
      POSTGRES_PASSWORD: ${COURSE_DB_PASS}
      POSTGRES_DB: ${COURSE_DB_NAME}
    volumes:
      - course_db_data:/var/lib/postgresql/data

  course-service:
    build:
      context: ../course-service
      dockerfile: Dockerfile
      secrets:
        - GITHUB_TOKEN
    environment:
      - APP_PORT=${PORT_COURSE}
      - DB_HOST=${COURSE_DB_HOST}
      - DB_PORT=${COURSE_DB_PORT}
      - DB_USER=${COURSE_DB_USER}
      - DB_PASS=${COURSE_DB_PASS}
      - DB_NAME=${COURSE_DB_NAME}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
    depends_on:
      course-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy


  inventory-db:
    image: postgres:15-alpine
    container_name: loanem-inventory-db
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASS}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data

  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: Dockerfile
      secrets:
        - GITHUB_TOKEN
    environment:
      - APP_PORT=${PORT_INVENTORY}
      - DB_HOST=${INVENTORY_DB_HOST}
      - DB_PORT=${INVENTORY_DB_PORT}
      - DB_USER=${INVENTORY_DB_USER}
      - DB_PASS=${INVENTORY_DB_PASS}
      - DB_NAME=${INVENTORY_DB_NAME}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - STORAGE_REGION=${S3_STORAGE_REGION}
      - STORAGE_BUCKET=${S3_STORAGE_BUCKET}
    depends_on:
      inventory-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  participant-db:
    image: postgres:15-alpine
    container_name: loanem-participant-db
    environment:
      POSTGRES_USER: ${PARTICIPANT_DB_USER}
      POSTGRES_PASSWORD: ${PARTICIPANT_DB_PASS}
      POSTGRES_DB: ${PARTICIPANT_DB_NAME}
    volumes:
      - participant_db_data:/var/lib/postgresql/data

  participant-service:
    build:
      context: ../participant-service
      dockerfile: Dockerfile
      secrets:
        - GITHUB_TOKEN
    environment:
      - APP_PORT=${PORT_PARTICIPANT}
      - DB_HOST=${PARTICIPANT_DB_HOST}
      - DB_PORT=${PARTICIPANT_DB_PORT}
      - DB_USER=${PARTICIPANT_DB_USER}
      - DB_PASS=${PARTICIPANT_DB_PASS}
      - DB_NAME=${PARTICIPANT_DB_NAME}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
    depends_on:
      participant-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  auth_db_data:
  course_db_data:
  inventory_db_data:
  participant_db_data:
  rabbitmq_data:
  redis_data:

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
    